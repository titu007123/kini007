<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Kini007 Seller Dashboard</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="seller-dashboard.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="seller.html"><img src="icon.svg" alt=""> <span>Kini007 <small>SELLER PORTAL</small></span></a>
    <div class="top-actions">
      <a href="index.html">View Store</a>
      <button id="sellerLogout" class="outline-btn" type="button">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">KINI007 MARKETPLACE</p>
      <h1>Seller Dashboard</h1>
      <p id="sellerWelcome">Loading your shop…</p>
    </section>

    <div id="sellerNotice" class="notice" role="status">Checking your seller account…</div>

    <section id="sellerApp" hidden>
      <div class="stats">
        <article><span>My products</span><strong id="sellerProductCount">—</strong></article>
        <article><span>Active listings</span><strong id="sellerActiveCount">—</strong></article>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div><p class="eyebrow">PRODUCT CATALOG</p><h2 id="productFormHeading">Add a product</h2></div>
          <button id="resetProductForm" class="outline-btn" type="button">＋ New product</button>
        </div>
        <form id="sellerProductForm">
          <input id="sellerProductId" type="hidden">
          <div class="form-grid">
            <label>Product name *<input id="spName" maxlength="180" required placeholder="e.g. Wireless Bluetooth Headphones"></label>
            <label>Category *
              <select id="spCategory" required>
                <option value="tech">Technology</option><option value="mobile">Mobile</option>
                <option value="accessories">Accessories</option><option value="home">Home & Living</option>
                <option value="health">Health & Fitness</option><option value="books">Books & Study</option>
                <option value="fashion">Fashion</option><option value="diamond">Diamond</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>Brand<input id="spBrand" maxlength="100" placeholder="Brand name"></label>
            <label>Price (BDT) *<input id="spPrice" type="number" min="0" step="0.01" required placeholder="1200"></label>
            <label class="wide">Description *<textarea id="spDescription" rows="4" maxlength="3000" required placeholder="Describe the product, condition, key features and what is included."></textarea></label>
            <label class="wide">Product image *<input id="spImage" type="file" accept="image/jpeg,image/png,image/webp" required><small>JPG, PNG or WEBP. Maximum 5 MB. Product images are public on the store.</small></label>
            <div class="wide preview-wrap" id="sellerImagePreview" hidden><img id="sellerPreviewImg" alt="Product preview"><span id="sellerImageHint"></span></div>
          </div>
          <div class="form-actions">
            <button id="sellerSaveProduct" class="primary-btn" type="submit">Publish product</button>
            <button id="sellerCancelEdit" class="outline-btn" type="button" hidden>Cancel edit</button>
          </div>
          <p id="sellerFormMessage" class="form-message" role="status"></p>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head list-head">
          <div><p class="eyebrow">YOUR SHOP</p><h2>My products</h2></div>
          <input id="sellerProductSearch" class="search" type="search" placeholder="Search my products">
        </div>
        <div id="sellerProducts" class="product-list"><p class="muted">Loading your products…</p></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="seller-dashboard.js"></script>
</body>
</html>
